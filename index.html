<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Happy Birthday</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #070707;
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f5f5f5;
            --muted: #a8a8a8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: radial-gradient(circle at top, #1b1b1b 0%, #070707 50%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* BACKGROUND GLOW */

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            filter: blur(90px);
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-30px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 420px;
            z-index: 2;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
            border-radius: 30px;
            padding: 34px 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        /* INTRO */

        .loading {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid white;
            margin: 0 auto 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* QUESTIONS */

        .question-screen {
            display: none;
        }

        .question {
            font-size: 25px;
            line-height: 1.4;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .answers {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 250px;
        }

        button {
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 16px;
            border-radius: 18px;
            font-size: 15px;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background 0.25s ease,
                opacity 0.25s ease;
            backdrop-filter: blur(10px);
            position: relative;
            will-change: transform;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .correct {
            background: white;
            color: black;
            font-weight: 600;
        }

        .reaction {
            margin-top: 20px;
            color: #cfcfcf;
            font-size: 14px;
            min-height: 20px;
            opacity: 0;
            transition: 0.3s;
        }

        /* FINAL SCREEN */

        .final-screen {
            display: none;
        }

        .glasses {
            font-size: 46px;
            margin-bottom: 22px;
            animation: float 5s ease-in-out infinite;
        }

        .final-title {
            font-size: 31px;
            line-height: 1.35;
            margin-bottom: 22px;
            font-weight: 600;
            letter-spacing: -0.7px;
        }

        .final-sub {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
            opacity: 0.5;
            animation: sparkle 6s linear infinite;
        }

        @keyframes sparkle {
            from {
                transform: translateY(0px);
                opacity: 0;
            }

            50% {
                opacity: 0.6;
            }

            to {
                transform: translateY(-120px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <!-- SPARKLES -->
    <div class="sparkle" style="top:85%;left:20%;animation-delay:0s;"></div>
    <div class="sparkle" style="top:90%;left:70%;animation-delay:1s;"></div>
    <div class="sparkle" style="top:95%;left:50%;animation-delay:2s;"></div>
    <div class="sparkle" style="top:80%;left:85%;animation-delay:3s;"></div>

    <div class="container">

        <!-- INTRO -->
        <div class="card" id="intro">

            <div class="loading"></div>

            <h1>Analyzing birthday girl...</h1>

            <div class="subtitle">
                Vision quality check initialized.
            </div>

        </div>

        <!-- QUESTIONS -->
        <div class="card question-screen" id="questions">

            <div class="question" id="questionText"></div>

            <div class="answers" id="answers"></div>

            <div class="reaction" id="reaction"></div>

        </div>

        <!-- FINAL -->
        <div class="card final-screen" id="final">

            <div class="glasses">👓</div>

            <div class="final-title">
                Sana en güzel günleri<br>
                en iyi şekilde görmen dileğiyle...
            </div>

            <div class="final-sub">
                İyi ki doğdun ❤️<br><br>
                Şimdi gerçek hediyene bakabilirsin.
            </div>

        </div>

    </div>

    <script>

        const questions = [

            {
                question: "Bugün sana ne alınmış olabilir?",
                answers: [
                    { text: "Tost makinesi", correct: false },
                    { text: "Dünyanın en güzel kızına uygun bir şey", correct: true },
                    { text: "Trafik konisi", correct: false }
                ]
            },

            {
                question: "Sence sana en çok ne yakışır?",
                answers: [
                    { text: "Kaynak makinesi", correct: false },
                    { text: "Gözlük", correct: true },
                    { text: "Matkap seti", correct: false }
                ]
            },

            {
                question: "Bu hediyeyi hak edecek kadar güzel misin?",
                answers: [
                    { text: "Hayır", correct: false },
                    { text: "Belki", correct: false },
                    { text: "Evet ama biraz fazla", correct: true }
                ]
            }

        ];

        const reactions = [
            "Nice try.",
            "Suspicious choice.",
            "I know you too well for that.",
            "That option seems inaccurate.",
            "That button disagrees.",
            "Absolutely not."
        ];

        let currentQuestion = 0;

        const intro = document.getElementById("intro");
        const questionsScreen = document.getElementById("questions");
        const finalScreen = document.getElementById("final");

        const questionText = document.getElementById("questionText");
        const answersContainer = document.getElementById("answers");
        const reaction = document.getElementById("reaction");

        /* INTRO DELAY */

        setTimeout(() => {

            intro.style.display = "none";
            questionsScreen.style.display = "block";

            loadQuestion();

        }, 2800);

        /* LOAD QUESTION */

        function loadQuestion() {

            reaction.style.opacity = 0;

            const q = questions[currentQuestion];

            questionText.innerText = q.question;

            answersContainer.innerHTML = "";

            q.answers.forEach(answer => {

                const btn = document.createElement("button");

                btn.innerText = answer.text;

                if (answer.correct) {

                    btn.classList.add("correct");

                    btn.onclick = () => {

                        currentQuestion++;

                        if (currentQuestion < questions.length) {

                            loadQuestion();

                        } else {

                            questionsScreen.style.display = "none";
                            finalScreen.style.display = "block";

                        }

                    };

                } else {

                    btn.addEventListener("mouseenter", (e) => {
                        moveButton(btn, e);
                    });

                    btn.addEventListener("touchstart", (e) => {
                        moveButton(btn, e);
                    });

                }

                answersContainer.appendChild(btn);

            });

        }

        /* MOVE BUTTON AWAY */

        function moveButton(button, event) {

            const mouseX =
                event.clientX ||
                (event.touches && event.touches[0].clientX);

            const mouseY =
                event.clientY ||
                (event.touches && event.touches[0].clientY);

            let moveX;
            let moveY;

            if (mouseX < window.innerWidth / 2) {
                moveX = Math.random() * 180 + 80;
            } else {
                moveX = -(Math.random() * 180 + 80);
            }

            if (mouseY < window.innerHeight / 2) {
                moveY = Math.random() * 120 + 40;
            } else {
                moveY = -(Math.random() * 120 + 40);
            }

            button.style.transform =
                `translate(${moveX}px, ${moveY}px)`;

            reaction.innerText =
                reactions[Math.floor(Math.random() * reactions.length)];

            reaction.style.opacity = 1;

        }

    </script>

</body>

</html>
