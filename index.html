<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gift</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont;
}

body{
  height:100vh;
  background:#0b0b0f;
  color:white;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* background glow */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 60%);
}

/* ================= ENTRY ================= */

.entry{
  text-align:center;
  z-index:5;
}

.box{
  font-size:70px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.entry h1{
  font-size:14px;
  font-weight:400;
  margin-top:10px;
  color:#ddd;
}

.entry p{
  font-size:11px;
  color:#666;
}

/* ================= LOADING ================= */

.loading{
  display:none;
  font-size:16px;
  text-align:center;
  animation:fade 1s forwards;
}

@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

/* ================= YEAR TRANSITION ================= */

.yearWrap{
  display:none;
  position:absolute;
  font-size:90px;
  font-weight:600;
}

.digit{
  position:absolute;
  transition:0.8s ease;
}

/* falling animation */
.fall{
  animation:fall 1s forwards;
}

@keyframes fall{
  to{
    transform:translateY(300px) rotate(60deg);
    opacity:0;
  }
}

/* ================= FINAL ================= */

.final{
  display:none;
  text-align:center;
  padding:20px;
  max-width:500px;
}

.final h1{
  font-size:20px;
  margin-bottom:10px;
}

.final p{
  font-size:14px;
  line-height:1.7;
  color:#ccc;
}

.small{
  margin-top:10px;
  font-size:12px;
  color:#777;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- ENTRY -->
<div class="entry" id="entry">
  <div class="box">🎁</div>
  <h1>tap to open</h1>
  <p>birthday experience</p>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  birthday girl loading...
</div>

<!-- YEAR ANIMATION -->
<div class="yearWrap" id="year">
  <div class="digit" id="d1">2</div>
  <div class="digit" id="d2" style="left:60px;">3</div>
</div>

<!-- FINAL -->
<div class="final" id="final">
  <h1>İyi ki doğdun</h1>
  <p>
    En güzel günleri en rahat şekilde görmen dileğiyle, nice senelere :)
  </p>
  <div class="small">—</div>
</div>

<script>

const entry = document.getElementById("entry");
const loading = document.getElementById("loading");
const year = document.getElementById("year");
const final = document.getElementById("final");

const d1 = document.getElementById("d1");
const d2 = document.getElementById("d2");

entry.addEventListener("click", async ()=>{

  // STEP 1: entry hide
  entry.style.display="none";

  // STEP 2: loading
  loading.style.display="block";

  setTimeout(()=>{

    loading.style.display="none";
    year.style.display="block";

    runAnimation();

  },1500);

});

function runAnimation(){

  // 23 → 24 illusion
  d1.innerText="2";
  d2.innerText="4";

  // create 4 “4” digits falling
  for(let i=0;i<4;i++){

    const el=document.createElement("div");
    el.innerText="4";
    el.style.position="absolute";
    el.style.left=(40 + i*20)+"px";
    el.style.top="0px";
    el.style.fontSize="80px";

    document.body.appendChild(el);

    setTimeout(()=>{
      el.classList.add("fall");
    },300*i);

  }

  // final reveal
  setTimeout(()=>{
    year.style.display="none";
    final.style.display="block";
  },2500);

}

</script>

</body>
</html>
