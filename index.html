<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gift</title>

<style>
body{
  margin:0;
  height:100vh;
  background:#0b0b0f;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-family:-apple-system;
  overflow:hidden;
}

/* background glow */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 60%);
}

/* START SCREEN */
.start{
  text-align:center;
  z-index:10;
}

.box{
  font-size:60px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.start h1{
  font-size:14px;
  font-weight:400;
  margin-top:10px;
  color:#ccc;
}

.start p{
  font-size:11px;
  color:#666;
  margin-top:6px;
}

/* MAIN */
.main{
  display:none;
  text-align:center;
  padding:20px;
  z-index:5;
}

.msg{
  font-size:18px;
  line-height:1.7;
  opacity:0;
  animation:fade 2s forwards;
}

@keyframes fade{
  to{opacity:1;}
}

.sub{
  margin-top:12px;
  font-size:13px;
  color:#aaa;
  opacity:0;
  animation:fade 2.5s 1s forwards;
}

/* tap effect */
.tap{
  position:absolute;
  bottom:25px;
  font-size:11px;
  color:#666;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- START -->
<div class="start" id="start">
  <div class="box">🎁</div>
  <h1>tap to open your gift</h1>
  <p>sound will start softly</p>
</div>

<!-- MAIN -->
<div class="main" id="main">

  <div class="msg">
    En güzel günleri en rahat şekilde görmen dileğiyle, nice senelere :)
  </div>

  <div class="sub">
    for you — always
  </div>

</div>

<div class="tap">music playing...</div>

<!-- AUDIO -->
<audio id="audio" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const start = document.getElementById("start");
const main = document.getElementById("main");
const audio = document.getElementById("audio");

let done = false;

start.addEventListener("click", async () => {

  if(done) return;
  done = true;

  // show main
  start.style.opacity = "0";
  start.style.transition = "0.8s";

  setTimeout(()=>{
    start.style.display = "none";
    main.style.display = "block";
  },800);

  // MUSIC FIX (important)
  try {
    audio.volume = 0.25;
    await audio.play();
  } catch(e) {
    console.log("audio blocked or missing file");
  }

});

</script>

</body>
</html>
