<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Birthday</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
  height:100vh;
  background:#0a0a0a;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* soft ambient glow */
.glow{
  position:absolute;
  width:700px;
  height:700px;
  background:rgba(255,255,255,0.04);
  filter:blur(140px);
  border-radius:50%;
}

/* container */
.wrap{
  text-align:center;
  max-width:520px;
  padding:20px;
  animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* main message */
.msg{
  font-size:18px;
  line-height:1.8;
  font-weight:400;
  color:#f2f2f2;
  margin-bottom:18px;
}

/* italian line */
.it{
  font-size:16px;
  color:#b8b8b8;
  margin-top:10px;
  font-style:italic;
}

/* small signature line */
.sig{
  margin-top:20px;
  font-size:12px;
  color:#777;
}

/* play hint */
.tap{
  margin-top:25px;
  font-size:12px;
  color:#555;
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="wrap">

  <div class="msg">
    En güzel günleri en rahat şekilde görmen dileğiyle, nice senelere :)
  </div>

  <div class="it">
    Così fortunato ad averti nella mia vita.
  </div>

  <div class="sig">
    —
  </div>

  <div class="tap">
    tap anywhere for music
  </div>

</div>

<!-- AUDIO -->
<audio id="bgm" loop>
  <!-- seçenek: Tommy Emmanuel / Tom Misch / Tidal Wave style instrumental -->
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bgm");

let started = false;

document.body.addEventListener("click", () => {
  if(!started){
    audio.volume = 0.25;
    audio.play();
    started = true;
  }
});
</script>

</body>
</html>
