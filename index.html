<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>

<title>Alignment</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body{
  height:100vh;
  background:#0a0a0a;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* glow */
.glow{
  position:absolute;
  width:600px;
  height:600px;
  background:rgba(255,255,255,0.04);
  filter:blur(120px);
  border-radius:50%;
}

/* INTRO */
.intro{
  text-align:center;
}

.year{
  font-size:110px;
  font-weight:600;
  animation:break 1.2s forwards;
}

@keyframes break{
  0%{transform:scale(1);}
  50%{transform:scale(1.2) rotate(-5deg);}
  100%{transform:scale(0.2) rotate(20deg);opacity:0;}
}

.newYear{
  font-size:110px;
  opacity:0;
  animation:appear 1.2s 1.1s forwards;
}

@keyframes appear{
  to{opacity:1;transform:scale(1);}
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
  opacity:0;
  animation:fade 1s 2s forwards;
}

@keyframes fade{
  to{opacity:1;}
}

/* QUIZ */
.quiz{
  display:none;
  width:90%;
  max-width:420px;
}

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px;
  padding:24px;
  backdrop-filter:blur(20px);
}

.question{
  font-size:18px;
  margin-bottom:16px;
  line-height:1.4;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:10px;
}

button{
  padding:14px;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  cursor:pointer;
  transition:0.2s;
}

button:active{
  transform:scale(0.97);
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
}

.dot{
  display:inline-block;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

/* RESULT */
.result{
  display:none;
  text-align:center;
  width:90%;
  max-width:420px;
}

h1{
  font-size:20px;
  margin-bottom:10px;
}

p{
  color:#bbb;
  font-size:14px;
  line-height:1.6;
  margin-bottom:15px;
}

.box{
  background:rgba(255,255,255,0.06);
  padding:15px;
  border-radius:16px;
  margin-top:10px;
  text-align:left;
  font-size:13px;
  color:#ddd;
}

.small{
  color:#888;
  font-size:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="glow"></div>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="year">23</div>
  <div class="newYear">24</div>
  <div class="subtitle">alignment initializing...</div>
</div>

<!-- QUIZ -->
<div class="quiz" id="quiz">
  <div class="card">
    <div class="question" id="q"></div>
    <div class="answers" id="a"></div>
  </div>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  aligning responses<span class="dot">...</span>
</div>

<!-- RESULT -->
<div class="result" id="result">

  <h1>İyi ki doğdun</h1>

  <p>
    En güzel günleri en rahat şekilde görebileceğin bir yıl diliyorum, nice senelere :)
  </p>

  <div class="box">
    <b>Your pattern</b><br>
    <div id="you"></div>
  </div>

  <div class="box">
    <b>Detected alignment</b><br>
    <div id="match"></div>
  </div>

  <div class="small">
    system: emotional alignment detected
  </div>

</div>

<script>

const questions = [
  {
    q:"Bugün seni en iyi anlatan cümle hangisi?",
    map:{
      0:"calm_tired",
      1:"thinking_silent",
      2:"protected_space",
      3:"coffee_mode"
    },
    a:[
      "Sessizim ama idare ediyorum",
      "Zihnim dolu ama sakinceyim",
      "Bugün kimse beni zorlamasın",
      "Kahve olmadan ben yokum"
    ]
  },
  {
    q:"Your current world feels like…",
    map:{
      0:"focus_silence",
      1:"balanced_control",
      2:"tired_flow",
      3:"coffee_survival"
    },
    a:[
      "controlled chaos",
      "focused silence",
      "tired but moving",
      "coffee-powered survival"
    ]
  },
  {
    q:"Brenda vetes sot je…",
    map:{
      0:"calm_tired",
      1:"deep_thinker",
      2:"in_control",
      3:"need_space"
    },
    a:[
      "e qetë por e lodhur",
      "duke menduar shumë",
      "në kontroll",
      "vetëm dua qetësi"
    ]
  },
  {
    q:"What do you need most today?",
    map:{
      0:"peace",
      1:"clarity",
      2:"space",
      3:"rest_flow"
    },
    a:[
      "peace",
      "clarity",
      "space",
      "nothing, just time"
    ]
  }
];

let i=0;
let profile = [];

const intro = document.getElementById("intro");
const quiz = document.getElementById("quiz");
const loading = document.getElementById("loading");
const result = document.getElementById("result");

const q = document.getElementById("q");
const a = document.getElementById("a");

const you = document.getElementById("you");
const match = document.getElementById("match");

/* intro */
setTimeout(()=>{
  intro.style.display="none";
  quiz.style.display="block";
  load();
},3200);

function load(){
  const item = questions[i];
  q.innerText = item.q;
  a.innerHTML="";

  item.a.forEach((txt,idx)=>{

    const b = document.createElement("button");
    b.innerText = txt;

    b.onclick = ()=>{
      profile.push(item.map[idx]);
      i++;

      if(i < questions.length){
        load();
      }else{
        finish();
      }
    };

    a.appendChild(b);
  });
}

function finish(){

  quiz.style.display="none";
  loading.style.display="block";

  setTimeout(()=>{

    loading.style.display="none";
    result.style.display="block";

    const counts = {};
    profile.forEach(p=>{
      counts[p] = (counts[p]||0)+1;
    });

    const sorted = Object.entries(counts)
      .sort((a,b)=>b[1]-a[1])
      .map(x=>x[0]);

    you.innerHTML = sorted.join("<br>");
    match.innerHTML = "same frequency detected";

  },2000);
}

</script>

</body>
</html>
