<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>

<title>Birthday Experience</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body{
  background:#0a0a0a;
  color:white;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SOFT LIGHT */
.glow{
  position:absolute;
  width:600px;
  height:600px;
  background:rgba(255,255,255,0.04);
  filter:blur(120px);
  border-radius:50%;
}

/* ===== INTRO ===== */

.intro{
  text-align:center;
  transition:1s ease;
}

.year{
  font-size:110px;
  font-weight:600;
  letter-spacing:-4px;
  transition:0.8s ease;
}

.break{
  animation:break 1.2s forwards;
}

@keyframes break{
  0%{transform:scale(1) rotate(0);}
  50%{transform:scale(1.15) rotate(-6deg);}
  100%{transform:scale(0.2) rotate(25deg);opacity:0;}
}

.newYear{
  font-size:110px;
  font-weight:600;
  opacity:0;
  transform:scale(0.6);
  animation:appear 1.2s 1.1s forwards;
}

@keyframes appear{
  to{opacity:1;transform:scale(1);}
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
  opacity:0;
  animation:fade 1s 2.2s forwards;
}

@keyframes fade{
  to{opacity:1;}
}

/* ===== QUIZ ===== */

.quiz{
  display:none;
  width:92%;
  max-width:420px;
}

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:26px;
  padding:26px;
  backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

.question{
  font-size:20px;
  line-height:1.4;
  margin-bottom:22px;
  font-weight:500;
}

/* TOUCH FRIENDLY */
.answers{
  display:flex;
  flex-direction:column;
  gap:12px;
}

button{
  padding:15px;
  border-radius:16px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:15px;
  transition:0.25s ease;
  touch-action:manipulation;
}

button:active{
  transform:scale(0.97);
}

.correct{
  background:white;
  color:black;
  font-weight:600;
}

/* subtle mobile hover replacement */
button:hover{
  background:rgba(255,255,255,0.15);
}

/* ===== FINAL ===== */

.final{
  display:none;
  text-align:center;
  width:90%;
  max-width:420px;
}

.final h1{
  font-size:26px;
  margin-bottom:12px;
  font-weight:600;
}

.final p{
  color:#b5b5b5;
  font-size:15px;
  line-height:1.7;
}

.glasses{
  font-size:42px;
  margin-bottom:18px;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

</style>
</head>

<body>

<div class="glow"></div>

<!-- INTRO -->
<div class="intro" id="intro">

  <div class="year break" id="y23">23</div>

  <div class="newYear">24</div>

  <div class="subtitle">a small reflection of you...</div>

</div>

<!-- QUIZ -->
<div class="quiz" id="quiz">

  <div class="card">

    <div class="question" id="q"></div>

    <div class="answers" id="a"></div>

  </div>

</div>

<!-- FINAL -->
<div class="final" id="final">

  <div class="glasses">👓</div>

  <h1>İyi ki doğdun</h1>

  <p>
    Sana en sakin, en iyi hissedeceğin bir yıl diliyorum.<br><br>
    I noticed the way you move through everything.
  </p>

</div>

<script>

const data = [
  {
    q:"Bugün modun hangisi?",
    a:[
      {t:"Quietly tired but here",c:false},
      {t:"I’m functioning",c:true},
      {t:"Don’t talk before americano",c:false}
    ]
  },
  {
    q:"Enerji kaynağın?",
    a:[
      {t:"Americano + focus",c:true},
      {t:"Music + headphones",c:false},
      {t:"Random chaos",c:false}
    ]
  },
  {
    q:"Gizli karakterin?",
    a:[
      {t:"Sarcastic strategist",c:true},
      {t:"Emotionally deep observer",c:false},
      {t:"I don’t care but I do",c:false}
    ]
  },
  {
    q:"Seni en çok ne rahatsız eder?",
    a:[
      {t:"Messy spaces",c:true},
      {t:"No personal boundaries",c:false},
      {t:"Noise overload",c:false}
    ]
  }
];

let i=0;

const intro = document.getElementById("intro");
const quiz = document.getElementById("quiz");
const final = document.getElementById("final");

const q = document.getElementById("q");
const a = document.getElementById("a");

/* INTRO FLOW */
setTimeout(()=>{

  intro.style.opacity="0";

  setTimeout(()=>{
    intro.style.display="none";
    quiz.style.display="block";
    load();
  },900);

},3200);

/* LOAD QUESTIONS */
function load(){

  const item = data[i];

  q.innerText = item.q;
  a.innerHTML="";

  item.a.forEach(ans=>{

    const b = document.createElement("button");
    b.innerText = ans.t;

    if(ans.c){
      b.classList.add("correct");

      b.ontouchstart = b.onclick = ()=>{
        i++;
        if(i<data.length){
          load();
        } else {
          quiz.style.display="none";
          final.style.display="block";
        }
      }
    }

    a.appendChild(b);

  });

}

</script>

</body>
</html>
