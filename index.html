<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>For You</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:#0b0b0f;
  color:white;
}

/* soft animated background */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06), transparent 40%),
             radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04), transparent 40%);
  animation:move 12s ease-in-out infinite alternate;
  filter:blur(20px);
}

@keyframes move{
  0%{transform:scale(1) translate(0,0);}
  100%{transform:scale(1.1) translate(20px,-20px);}
}

/* ENTRY SCREEN */
.entry{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  z-index:10;
}

.entry h1{
  font-size:16px;
  font-weight:400;
  color:#ddd;
  letter-spacing:0.5px;
}

.entry p{
  margin-top:8px;
  font-size:12px;
  color:#777;
}

/* MAIN */
.main{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  flex-direction:column;
  padding:20px;
}

/* message animation */
.msg{
  font-size:18px;
  line-height:1.8;
  max-width:500px;
  opacity:0;
  transform:translateY(10px);
  animation:fadeIn 1.8s ease forwards;
}

@keyframes fadeIn{
  to{opacity:1; transform:translateY(0);}
}

/* italian line */
.sub{
  margin-top:14px;
  font-size:14px;
  color:#aaa;
  font-style:italic;
  opacity:0;
  animation:fadeSub 2.5s 0.8s ease forwards;
}

@keyframes fadeSub{
  to{opacity:1;}
}

/* music hint */
.hint{
  position:absolute;
  bottom:30px;
  font-size:11px;
  color:#666;
  opacity:0.7;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- ENTRY -->
<div class="entry" id="entry">
  <h1>tap to open</h1>
  <p>sound will start softly</p>
</div>

<!-- MAIN -->
<div class="main" id="main">

  <div class="msg">
    En güzel günleri en rahat şekilde görmen dileğiyle, nice senelere :)
  </div>

  <div class="sub">
    for you — always
  </div>

  <div class="hint">
    music playing softly
  </div>

</div>

<!-- AUDIO -->
<audio id="bgm" loop>
  <!-- önerilen: Tom Misch / Tommy Emmanuel soft instrumental -->
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const entry = document.getElementById("entry");
const main = document.getElementById("main");
const audio = document.getElementById("bgm");

let started = false;

entry.addEventListener("click", () => {

  if(started) return;
  started = true;

  // fade entry out
  entry.style.opacity = "0";
  entry.style.transition = "1s ease";

  setTimeout(()=>{

    entry.style.display = "none";
    main.style.display = "flex";

    // start music
    audio.volume = 0.25;
    audio.play();

  },900);

});

</script>

</body>
</html>
