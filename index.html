<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>

<title>Alignment</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body{
  height:100vh;
  overflow:hidden;
  background:#0a0a0a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* glow */
.glow{
  position:absolute;
  width:600px;
  height:600px;
  background:rgba(255,255,255,0.04);
  filter:blur(120px);
  border-radius:50%;
}

/* ===== INTRO ===== */

.intro{
  text-align:center;
  transition:1s ease;
}

.year{
  font-size:110px;
  font-weight:600;
  letter-spacing:-5px;
  animation:break 1.2s forwards;
}

@keyframes break{
  0%{transform:scale(1);}
  50%{transform:scale(1.2) rotate(-5deg);}
  100%{transform:scale(0.2) rotate(25deg);opacity:0;}
}

.newYear{
  font-size:110px;
  font-weight:600;
  opacity:0;
  transform:scale(0.6);
  animation:appear 1.2s 1.1s forwards;
}

@keyframes appear{
  to{opacity:1;transform:scale(1);}
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
  opacity:0;
  animation:fade 1s 2s forwards;
}

@keyframes fade{
  to{opacity:1;}
}

/* ===== QUIZ ===== */

.quiz{
  display:none;
  width:92%;
  max-width:420px;
}

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:26px;
  padding:26px;
  backdrop-filter:blur(20px);
}

.question{
  font-size:18px;
  margin-bottom:18px;
  color:#f5f5f5;
  line-height:1.4;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:12px;
}

button{
  padding:14px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  transition:0.25s ease;
  cursor:pointer;
}

button:active{
  transform:scale(0.97);
}

button:hover{
  background:rgba(255,255,255,0.15);
}

.correct{
  background:white;
  color:black;
  font-weight:600;
}

/* ===== FINAL ===== */

.final{
  display:none;
  text-align:center;
  width:90%;
  max-width:420px;
}

.final h1{
  font-size:22px;
  font-weight:600;
  margin-bottom:12px;
}

.final p{
  color:#bbb;
  font-size:14px;
  line-height:1.7;
}

.glasses{
  font-size:42px;
  margin-bottom:18px;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

</style>
</head>

<body>

<div class="glow"></div>

<!-- INTRO -->
<div class="intro" id="intro">

  <div class="year">23</div>
  <div class="newYear">24</div>
  <div class="subtitle">alignment initializing...</div>

</div>

<!-- QUIZ -->
<div class="quiz" id="quiz">

  <div class="card">

    <div class="question" id="q"></div>
    <div class="answers" id="a"></div>

  </div>

</div>

<!-- FINAL -->
<div class="final" id="final">

  <div class="glasses">👓</div>

  <h1>İyi ki doğdun</h1>

  <p>
    En güzel günleri en iyi şekilde görmen dileğiyle,<br>
    nice senelere :)
  </p>

</div>

<script>

const data = [

  {
    q:"Bugün seni en iyi anlatan cümle hangisi?",
    a:[
      "Sessizim ama idare ediyorum",
      "Zihnim dolu ama sakinceyim",
      "Bugün kimse beni zorlamasın",
      "Kahve olmadan ben yokum"
    ]
  },

  {
    q:"Your current world feels like…",
    a:[
      "controlled chaos",
      "focused silence",
      "tired but moving",
      "coffee-powered survival"
    ]
  },

  {
    q:"Brenda vetes sot je…",
    a:[
      "e qetë por e lodhur",
      "duke menduar shumë",
      "në kontroll",
      "vetëm dua qetësi"
    ]
  },

  {
    q:"What do you need most today?",
    a:[
      "peace",
      "clarity",
      "space",
      "nothing, just time"
    ]
  }

];

let i = 0;

const intro = document.getElementById("intro");
const quiz = document.getElementById("quiz");
const final = document.getElementById("final");

const q = document.getElementById("q");
const a = document.getElementById("a");

/* INTRO FLOW */
setTimeout(()=>{

  intro.style.opacity = "0";

  setTimeout(()=>{
    intro.style.display = "none";
    quiz.style.display = "block";
    load();
  },900);

},3200);

/* LOAD */
function load(){

  const item = data[i];

  q.innerText = item.q;
  a.innerHTML = "";

  item.a.forEach(txt=>{

    const b = document.createElement("button");
    b.innerText = txt;

    b.onclick = ()=>{
      i++;
      if(i < data.length){
        load();
      }else{
        quiz.style.display="none";
        final.style.display="block";
      }
    };

    a.appendChild(b);

  });

}

</script>

</body>
</html>
