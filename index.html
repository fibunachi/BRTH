<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Birthday</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont;
}

body{
  height:100vh;
  background:#0b0b0f;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* soft cinematic background */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center, rgba(255,255,255,0.07), transparent 60%);
  animation:slow 10s ease-in-out infinite alternate;
}

@keyframes slow{
  0%{transform:scale(1);}
  100%{transform:scale(1.08);}
}

/* ENTRY */
.entry{
  text-align:center;
  z-index:10;
}

.gift{
  font-size:72px;
  animation:float 2.2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.entry h1{
  font-size:14px;
  margin-top:10px;
  color:#ddd;
  font-weight:400;
}

.entry p{
  font-size:11px;
  color:#777;
}

/* YEAR TRANSITION */
.year{
  position:absolute;
  font-size:120px;
  font-weight:600;
  letter-spacing:-4px;
  opacity:0;
  transform:scale(0.95);
  transition:1s ease;
}

/* FINAL */
.final{
  display:none;
  text-align:center;
  max-width:520px;
  padding:20px;
  animation:fade 1.6s ease forwards;
}

@keyframes fade{
  from{opacity:0; transform:translateY(12px);}
  to{opacity:1; transform:translateY(0);}
}

.final h1{
  font-size:20px;
  margin-bottom:12px;
}

.final p{
  font-size:14px;
  line-height:1.8;
  color:#d6d6d6;
}

.quote{
  margin-top:14px;
  font-style:italic;
  color:#a8a8a8;
  font-size:13px;
}

.small{
  margin-top:18px;
  font-size:11px;
  color:#777;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- ENTRY -->
<div class="entry" id="entry">
  <div class="gift">🎁</div>
  <h1>tap to open</h1>
  <p>a small moment for you</p>
</div>

<!-- YEAR -->
<div class="year" id="year">23</div>

<!-- FINAL -->
<div class="final" id="final">

  <h1>İyi ki doğdun</h1>

  <p>
    En güzel günleri en rahat şekilde görmen dileğiyle, nice senelere :)
  </p>

  <div class="quote">
    For you, a thousand times over.
  </div>

  <div class="small">—</div>

</div>

<script>

const entry = document.getElementById("entry");
const year = document.getElementById("year");
const final = document.getElementById("final");

entry.addEventListener("click", ()=>{

  entry.style.opacity="0";
  entry.style.transition="0.8s ease";

  setTimeout(()=>{

    entry.style.display="none";

    // STEP 1: show 23
    year.style.opacity="1";

    // smooth entrance
    year.style.transition="1s ease";
    year.style.transform="scale(1)";

    // STEP 2: cinematic morph
    setTimeout(()=>{

      // fade + blur effect simulation
      year.style.opacity="0.25";
      year.style.transform="scale(1.1)";

      setTimeout(()=>{

        // transform 23 → 24
        year.innerText="24";
        year.style.opacity="1";
        year.style.transform="scale(1)";

      },700);

    },1200);

    // STEP 3: final reveal
    setTimeout(()=>{

      year.style.opacity="0";

      setTimeout(()=>{
        year.style.display="none";
        final.style.display="block";
      },500);

    },2600);

  },800);

});

</script>

</body>
</html>
